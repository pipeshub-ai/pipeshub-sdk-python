name: Release to PyPI & GitHub

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}

      - name: Extract version from .speakeasy/gen.yaml
        id: version
        run: |
          VERSION=$(uv run --with pyyaml python -c "import yaml; data=yaml.safe_load(open('.speakeasy/gen.yaml')); print(data['python']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "v${{ steps.version.outputs.VERSION }}"
          git push origin "v${{ steps.version.outputs.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: dist/*

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push to GitHub Packages
        working-directory: dist
        run: |
          oras push "ghcr.io/pipeshub-ai/pipeshub-sdk-python:${{ steps.version.outputs.VERSION }}" \
            --artifact-type application/vnd.pipeshub.sdk.python \
            --annotation "org.opencontainers.image.source=https://github.com/pipeshub-ai/pipeshub-ai" \
            --annotation "org.opencontainers.image.description=PipesHub Python SDK. Install with: pip install pipeshub-sdk" \
            --annotation "org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0" \
            *
          oras tag "ghcr.io/pipeshub-ai/pipeshub-sdk-python:${{ steps.version.outputs.VERSION }}" latest
