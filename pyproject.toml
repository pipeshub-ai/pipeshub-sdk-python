[project]
name = "pipeshub-sdk"
version = "2.0.0"
description = "Official Python SDK for the PipesHub API. Search and chat over your company's knowledge."
authors = [{ name = "Pipeshub" },]
readme = "README-PYPI.md"
requires-python = ">=3.10"
dependencies = [
    "httpcore >=1.0.9",
    "httpx >=0.28.1",
    "pydantic >=2.11.2",
]
urls.homepage = "https://pipeshub.com"
urls.repository = "https://github.com/pipeshub-ai/pipeshub-sdk-python"
urls.documentation = "https://docs.pipeshub.com/developer/api-reference"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
langchain = [
    "langchain-core >=0.3.0",
]
llamaindex = [
    "llama-index-core >=0.11.0",
]

[dependency-groups]
dev = [
    "mypy ==1.15.0",
    "pylint ==3.2.3",
    "pyright ==1.1.398",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio >=1.3.0",
    "pytest-xdist (>=3.8.0,<4.0.0)",
]

devDependencies = [
]

peerDependencies = [
]

dependencies = [
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.mypy]
disable_error_code = "misc"
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "typing_inspect"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonpath"
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"


